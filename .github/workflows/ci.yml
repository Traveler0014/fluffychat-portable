name: CI

on:
  push:
    branches: [main, tauri]
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow (图标生成)
        run: pip install pillow
      - name: Prepare web assets (可重现构建验证)
        run: ./prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: |
            build/web_offline
            src-tauri/icons

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system deps (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf
      - name: Build (release)
        run: |
          cd src-tauri
          cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat-portable-${{ matrix.os }}
          path: src-tauri/target/${{ matrix.target }}/release/fluffychat-portable*
