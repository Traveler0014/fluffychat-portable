name: Build & Release

# 手动触发: 输入 FluffyChat 版本号, 构建 Windows 单 exe + 安装器 并发布到 GitHub Releases
# 用法: Actions 页面 → Run workflow → 填 FluffyChat 版本 (默认 v2.8.0)
# 也可被 auto-upstream.yml (上游发布自动跟随) 以 reusable workflow 方式调用
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'FluffyChat 上游版本 (如 v2.8.0)'
        required: true
        default: 'v2.8.0'
        type: string
      tag:
        description: '自定义 Git tag (默认 tauri-<version>)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: 'FluffyChat 上游版本 (如 v2.8.0)'
        required: true
        type: string
      tag:
        description: '自定义 Git tag (默认 tauri-<version>)'
        required: false
        default: ''
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      # 上游 web 包内嵌 version.json 的版本号 / 是否与请求版本不一致 (见 Verify 步骤说明)
      web_pkg_version: ${{ steps.verify.outputs.web_pkg_version }}
      web_pkg_mismatch: ${{ steps.verify.outputs.web_pkg_mismatch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow (图标生成)
        run: pip install pillow
      - name: Prepare web assets
        run: ./prepare.sh ${{ inputs.version }}
      - name: Verify upstream web asset & sync build metadata
        id: verify
        # 1) 资产完整性: 与 GitHub Releases 上该 tag 附带的 fluffychat-web.tar.gz 逐字节比对
        #    (= 防镜像陈旧/截断产物; 这是唯一权威判据)
        # 2) 版本元数据: 上游偶尔发布内嵌版本落后的 web 包 (v2.11.1 的资产里 version.json
        #    仍是 2.11.0/build 3570), 旧逻辑直接硬失败 → 自动跟随任务每 6h 空转报错。
        #    改为: 同 major.minor 仅告警并继续; 跨 minor 仍硬失败 (那才是镜像/参数错误)。
        # 3) 同步 tauri.conf.json / Cargo.toml 版本 —— 两者在仓库里是写死的基线版本,
        #    不回写会导致 NSIS/MSI 文件名与 exe 属性停留在旧版本号 (如 v2.9.1 构建出 2.8.0 安装器)
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 版本号格式校验 (与 auto-upstream.yml 一致)
          [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*(\+[0-9]+)?$ ]] \
            || { echo "::error::非法版本号: $VERSION"; exit 1; }
          VER="${VERSION#v}"      # 去 v 前缀
          VER="${VER%%+*}"        # 去 +build 元数据 (不进安装器命名)

          TARBALL="fluffychat-web-${VERSION}.tar.gz"
          ACTUAL_SHA=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          AUTH=()
          if [ -n "${GH_TOKEN:-}" ]; then AUTH=(-H "Authorization: Bearer ${GH_TOKEN}"); fi
          EXPECTED=$(curl -fsSL ${AUTH[@]+"${AUTH[@]}"} \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/krille-chan/fluffychat/releases/tags/${VERSION}" \
            | jq -r '.assets[] | select(.name == "fluffychat-web.tar.gz") | .digest // empty')
          if [ -n "$EXPECTED" ]; then
            [ "sha256:$ACTUAL_SHA" = "$EXPECTED" ] \
              || { echo "::error::web 包 digest 不匹配: 本地 sha256:$ACTUAL_SHA, 上游 $EXPECTED (镜像陈旧或下载损坏)"; exit 1; }
            echo "资产完整性校验通过: 与上游 ${VERSION} 发布资产一致 (${EXPECTED:0:19}…)"
          else
            echo "::warning::上游未提供资产 digest, 跳过完整性校验 (仅剩版本元数据校验)"
          fi

          ACTUAL=$(jq -r '.version' build/web_offline/version.json)
          BUILD_NO=$(jq -r '.build_number' build/web_offline/version.json)
          if [ "$ACTUAL" = "$VER" ]; then
            echo "上游 web 包版本校验通过: $ACTUAL (build $BUILD_NO)"
          elif [ "${ACTUAL%.*}" = "${VER%.*}" ]; then
            echo "::warning::上游 ${VERSION} 的 web 包内嵌版本仍是 $ACTUAL (build $BUILD_NO) —— 上游打包问题; 资产 digest 已一致, 继续构建, Release 说明将标注该情况"
          else
            echo "::error::版本不匹配: 请求 $VER, 但 web 包实际为 $ACTUAL"; exit 1
          fi
          MISMATCH=false
          [ "$ACTUAL" = "$VER" ] || MISMATCH=true
          {
            echo "web_pkg_version=$ACTUAL"
            echo "web_pkg_mismatch=$MISMATCH"
          } >> "$GITHUB_OUTPUT"

          jq --arg v "$VER" '.version = $v' src-tauri/tauri.conf.json > src-tauri/.tauri.conf.tmp \
            && mv src-tauri/.tauri.conf.tmp src-tauri/tauri.conf.json
          sed -i "0,/^version = \".*\"/s//version = \"$VER\"/" src-tauri/Cargo.toml
          echo "构建元数据版本已同步: $VER (安装器将命名为 *_${VER}_*)"
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: |
            build/web_offline
            src-tauri/icons
            src-tauri/tauri.conf.json
            src-tauri/Cargo.toml

  build-windows:
    needs: prepare
    runs-on: windows-latest
    outputs:
      # 透传给 release 作业 (needs 只暴露直接依赖的 outputs)
      web_pkg_version: ${{ needs.prepare.outputs.web_pkg_version }}
      web_pkg_mismatch: ${{ needs.prepare.outputs.web_pkg_mismatch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build portable exe (单文件)
        run: |
          cd src-tauri
          cargo build --release --target x86_64-pc-windows-msvc
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Bundle NSIS + MSI installers
        run: |
          cd src-tauri
          cargo tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc
      - name: Verify bundle outputs (防止安装器静默丢失)
        # 此前 tauri build 未带 --target, 安装器落在 target/release/bundle/ 而
        # upload-artifact 只扫 target/<triple>/release/bundle/ → glob 匹配不到,
        # upload-artifact 仅 warning 不报错 → Release 只剩 exe。这里显式校验。
        shell: bash
        run: |
          BUNDLE=src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          compgen -G "$BUNDLE/nsis/*-setup.exe" > /dev/null \
            || { echo "::error::NSIS installer missing under $BUNDLE/nsis/"; ls -R "$BUNDLE" || true; exit 1; }
          compgen -G "$BUNDLE/msi/*.msi" > /dev/null \
            || { echo "::error::MSI installer missing under $BUNDLE/msi/"; ls -R "$BUNDLE" || true; exit 1; }
          ls -la "$BUNDLE/nsis" "$BUNDLE/msi"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat-portable-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/fluffychat-portable.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fluffychat-portable-windows
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || format('tauri-{0}', inputs.version) }}
          name: FluffyChat Portable (Tauri) ${{ inputs.version }}
          files: dist/**
          body: |
            FluffyChat Web **${{ inputs.version }}** 的离线单二进制桌面封装 (Tauri 版)。

            ${{ needs.build-windows.outputs.web_pkg_mismatch == 'true' && format('> ⚠️ 上游 {0} 的 `fluffychat-web.tar.gz` 内嵌 `version.json` 仍为 **{1}** (上游打包未更新版本号)。本包内嵌资源即该资产原文 (digest 已核验一致), 页面内部版本号显示 {1} 属正常现象。', inputs.version, needs.build-windows.outputs.web_pkg_version) || '' }}

            ## 文件
            - `fluffychat-portable.exe` — 便携单文件 (推荐, 双击即用, 无安装)
            - `FluffyChat.Portable_*_x64-setup.exe` — NSIS 安装器
            - `FluffyChat.Portable_*_x64_*.msi` — MSI 安装器

            ## 用法
            双击运行即弹桌面窗口; 关闭窗口隐藏到系统托盘, 托盘右键退出。
            预设服务器: `fluffychat-portable.exe -homeserver <你的服务器>`

            ## 依赖
            Windows 10/11 普遍内置 WebView2; 极老/精简系统需先装 Microsoft Edge WebView2 Runtime。

            ## 合规
            - 打包的 FluffyChat (AGPL-3.0): 上游 https://github.com/krille-chan/fluffychat (tag `${{ inputs.version }}`)
            - 对应源码与可重现构建: 本仓库 `prepare.sh` + `src-tauri/` (本 Release 即由 CI 构建)
            - 详见 THIRD_PARTY_NOTICES.md
