name: Build & Release

# 手动触发: 输入 FluffyChat 版本号, 构建全平台单二进制并发布到 GitHub Releases
# 用法: Actions 页面 → Run workflow → 填 FluffyChat 版本 (默认 v2.8.0)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'FluffyChat 上游版本 (如 v2.8.0)'
        required: true
        default: 'v2.8.0'
      tag:
        description: '自定义 Git tag (默认 portable-<version>)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Pillow (托盘图标生成)
        run: pip install pillow

      - name: Prepare web assets
        run: ./prepare.sh ${{ inputs.version }}

      - name: Verify upstream version
        # 校验实际下载的 web 包版本与请求一致 (防镜像错误/陈旧产物)。
        # 二进制命名由 build.sh 从 version.json 动态读取, 无元数据硬编码;
        # 但若镜像给错包, Release tag/body 与产物版本会不一致 → 这里拦下。
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*(\+[0-9]+)?$ ]] \
            || { echo "::error::非法版本号: $VERSION"; exit 1; }
          VER="${VERSION#v}"; VER="${VER%%+*}"
          ACTUAL=$(jq -r '.version' build/web_offline/version.json)
          BUILD_NO=$(jq -r '.build_number' build/web_offline/version.json)
          [ "$ACTUAL" = "$VER" ] \
            || { echo "::error::版本不匹配: 请求 $VER, 但 web 包实际为 $ACTUAL"; exit 1; }
          echo "上游 web 包版本校验通过: $ACTUAL (build $BUILD_NO)"

      - name: Build all targets
        run: ./build.sh

      - name: Smoke test
        run: |
          ./dist/fluffychat-portable-linux-x64 -no-open -port 0 > /tmp/pfc.log 2>&1 &
          for i in $(seq 1 10); do grep -q '已启动' /tmp/pfc.log && break; sleep 1; done
          PORT=$(grep -oP '127\.0\.0\.1:\d+' /tmp/pfc.log | head -1)
          curl -sf "$PORT/health" | grep -q fluffychat-portable && echo "health OK"
          curl -sf -o /dev/null "$PORT/canvaskit/chromium/canvaskit.wasm" && echo "canvaskit OK"
          PORTNUM=${PORT##*:}
          ./dist/fluffychat-portable-linux-x64 -stop -port "$PORTNUM"
          echo "SMOKE OK"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluffychat-portable-${{ inputs.version }}
          path: dist/

      - name: Clean existing release (可重跑同版本)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || format('portable-{0}', inputs.version) }}"
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || format('portable-{0}', inputs.version) }}
          name: FluffyChat Portable ${{ inputs.version }}
          files: dist/*
          body: |
            FluffyChat Web **${{ inputs.version }}** 的离线单二进制封装。

            ## 文件
            - `fluffychat-portable-win64-gui-v*.exe` — Windows x64, 托盘常驻 (推荐)
            - `fluffychat-portable-win64-v*.exe` — Windows x64, 控制台版
            - `fluffychat-portable-win32-v*.exe` — Windows x86 (win32)
            - `fluffychat-portable-linux-x64` — Linux x64

            ## 用法
            双击 exe 即起本地服务 (127.0.0.1:8800) 并打开浏览器; 预设服务器:
            `fluffychat-portable.exe -homeserver <你的服务器>`
            退出: 托盘图标 → 退出 (或 `-stop`)。

            ## 合规
            - 打包的 FluffyChat (AGPL-3.0): 上游 https://github.com/krille-chan/fluffychat (tag `${{ inputs.version }}`)
            - 对应源码与可重现构建: 本仓库 `prepare.sh` + `build.sh` (本 Release 即由 CI 构建)
            - 详见 THIRD_PARTY_NOTICES.md
